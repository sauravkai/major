name: CI

on:
  push:
    branches: [main, master]
  pull_request:

defaults:
  run:
    working-directory: major_project-main

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: major_project-main/server/package-lock.json
      - run: npm ci
        working-directory: major_project-main/server
      - run: npm test
        working-directory: major_project-main/server

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: major_project-main/client/package-lock.json
      - run: npm ci
        working-directory: major_project-main/client
      - run: npm run build
        working-directory: major_project-main/client
